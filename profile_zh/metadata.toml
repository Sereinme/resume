#:schema ../metadata.toml.schema.json

# Profile: Chinese. Each profile_<name>/metadata.toml is a complete, self-
# contained CV configuration. Switch profiles at compile time:
#     typst compile cv.typ --input profile=zh

# Italic tagline displayed below your name and contact info
header_quote = "清华大学电子工程系 2023 级直博生，信息与通信工程专业，主攻 GNSS 定位与时间同步安全方向，已发表一作论文 3 篇（含 IEEE Trans. Smart Grid）。具备扎实的算法研发与工程落地能力，在嵌入式开发、数据科学与具身智能领域有多段实习经历。"

# Text shown in the left side of the footer on CV pages
cv_footer = "简历"

# Text shown in the left side of the footer on cover letter pages
letter_footer = "申请信"

[layout]
    awesome_color = "skyblue"

    before_section_skip = "1pt"
    before_entry_skip = "1pt"
    before_entry_description_skip = "1pt"

    paper_size = "a4"

    # CJK date strings need a wider right column than the Latin default
    date_width = "4.7cm"

    [layout.fonts]
        # Mixed Latin + CJK. Typst's codepoint-level fallback picks LXGW WenKai
        # for CJK characters and Libertinus Serif for Latin.
        regular_fonts = ["Libertinus Serif", "LXGW WenKai"]
        # Kai (楷体) used for the name and section headings
        header_font = "TsangerJinKai03"

    [layout.header]
        header_align = "left"
        display_profile_photo = true
        profile_photo_radius = "50%"
        info_font_size = "10pt"

    [layout.entry]
        display_entry_society_first = false
        display_logo = true

    [layout.section]
        # CJK convention: highlight the whole section title
        title_highlight = "full"

    [layout.footer]
        display_page_counter = false
        display_footer = true


[inject]
    # Hidden ATS keyword text is disabled by default — see profile_en/metadata.toml
    # for the trade-offs. Uncomment only with truthful keywords.
    # injected_keywords_list = ["GNSS", "定位算法", "FPGA", "Python", "MATLAB"]

[personal]
    first_name = "Wenhao"
    last_name = "Li"

    # display_name overrides the Latin "first (light) + last (bold)" split with
    # a single styled string
    display_name = "李文昊"

    [personal.info]
        github = "Sereinme"
        phone = "+86 15681220023"
        email = "liwh23@mails.tsinghua.edu.cn"
        linkedin = "liwh01"
        orcid = "0009-0004-7752-6737"
        researchgate = "Wenhao-Li-66"

        [personal.info.custom-degree]
            awesomeIcon = "graduation-cap" # See https://typst.app/universe/package/fontawesome/
            text = "清华大学电子工程系博士"
            link = "https://www.tsinghua.edu.cn"
