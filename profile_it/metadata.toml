#:schema ../metadata.toml.schema.json

# Profile: Italian. Each profile_<name>/metadata.toml is a complete, self-
# contained CV configuration. Switch profiles at compile time:
#     typst compile cv.typ --input profile=it

# Italic tagline displayed below your name and contact info
header_quote = "Dottorando in Ingegneria dell'informazione e della comunicazione all'Università Tsinghua (anno 2023), specializzato in posizionamento GNSS e sicurezza della sincronizzazione temporale, con 3 pubblicazioni come primo autore tra cui IEEE Transactions on Smart Grid. Esperienza in sviluppo embedded FPGA, data science e intelligenza incarnata."

# Text shown in the left side of the footer on CV pages
cv_footer = "Curriculum vitae"

# Text shown in the left side of the footer on cover letter pages
letter_footer = "Lettera di presentazione"

[layout]
    awesome_color = "skyblue"

    before_section_skip = "1pt"
    before_entry_skip = "1pt"
    before_entry_description_skip = "1pt"

    paper_size = "a4"

    date_width = "3.6cm"

    [layout.fonts]
        regular_fonts = ["Libertinus Serif"]
        header_font = "Libertinus Serif"

    [layout.header]
        header_align = "left"
        display_profile_photo = true
        profile_photo_radius = "50%"
        info_font_size = "10pt"

    [layout.entry]
        display_entry_society_first = false
        display_logo = true

    [layout.section]
        title_highlight = "first-letters"
        title_highlight_letters = 3

    [layout.footer]
        display_page_counter = false
        display_footer = true


[inject]
    # Hidden ATS keyword text is disabled by default — see profile_en/metadata.toml
    # for the trade-offs. Uncomment only with truthful keywords.
    # injected_keywords_list = ["GNSS", "algoritmo di posizionamento", "FPGA", "Python", "MATLAB"]

